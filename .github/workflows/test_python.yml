name: Test Python SDK

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tests:
                description: 'Tests to run, e.g. "test_patient test_sharing" (empty runs everything)'
                required: false
                default: ''
                type: string

jobs:
    python-tests:
        runs-on: ubuntu-latest
        name: Run the python SDK tests
        env:
            ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.REPO_USERNAME }}
            ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.REPO_PASSWORD }}
            ORG_GRADLE_PROJECT_mavenRepository: ${{ secrets.MAVEN_REPOSITORY }}
            ORG_GRADLE_PROJECT_mavenReleasesRepository: ${{ secrets.MAVEN_RELEASES_REPOSITORY }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    submodules: 'recursive'
                    token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: 21
                    cache: 'gradle'

            -   name: Set up python 3.12
                uses: actions/setup-python@v5
                with:
                    python-version: '3.12'

            -   name: Write github credentials to local.properties
                run: |
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> local.properties
                    echo "cinteropsLibsDir=/usr/lib/x86_64-linux-gnu" >> local.properties
                    mkdir -p ksp-json-processor
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > ksp-json-processor/local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> ksp-json-processor/local.properties

            -   name: Install native link dependencies
                run: sudo apt-get update && sudo apt-get install -y libssl-dev

            -   name: Build the native library
                run: ./gradlew :python-wrapper:linkDebugSharedLinuxX64

            -   name: Build the wheel
                run: ./gradlew :python-wrapper:prepareLinuxX64DistributionArchive

            -   name: Install the SDK and the test dependencies
                run: |
                    python3 -m pip install --upgrade pip
                    python3 -m pip install python-wrapper/src/commonMain/resources/dist/cardinal_sdk-*.whl
                    python3 -m pip install -r python-wrapper/test/requirements.txt

            -   name: Run the tests
                working-directory: python-wrapper/test
                run: python3 tests.py ${{ github.event.inputs.tests }}
                env:
                    CARDINAL_URL: ${{ secrets.CARDINAL_TEST_URL }}
                    CARDINAL_USER_1_USERNAME: ${{ secrets.CARDINAL_TEST_USER_1_USERNAME }}
                    CARDINAL_USER_1_PASSWORD: ${{ secrets.CARDINAL_TEST_USER_1_PASSWORD }}
                    CARDINAL_USER_1_TOKEN: ${{ secrets.CARDINAL_TEST_USER_1_TOKEN }}
                    CARDINAL_USER_2_USERNAME: ${{ secrets.CARDINAL_TEST_USER_2_USERNAME }}
                    CARDINAL_USER_2_PASSWORD: ${{ secrets.CARDINAL_TEST_USER_2_PASSWORD }}
                    CARDINAL_USER_2_TOKEN: ${{ secrets.CARDINAL_TEST_USER_2_TOKEN }}
