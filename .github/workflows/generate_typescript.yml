name: Generate Typescript SDK
on:
    push:
        branches:
            - develop
        paths:
            - 'cardinal-sdk/src/commonMain/**'
    pull_request:
        # Only `opened`/`reopened`: a `synchronize` event would re-run the generation for any new commit as long as
        # the *whole* PR diff touches `paths`, even when the new commit itself does not. New commits are covered by
        # the `push` trigger above, whose `paths` filter is evaluated against the pushed commits only.
        types:
            - opened
            - reopened
        branches:
            - main
        paths:
            - 'cardinal-sdk/src/commonMain/**'
env:
    JSON_OUTPUT_DIR: ./cardinal-sdk/build/generated/ksp/jvm/jvmMain/resources
    BUILDER_JAR_PATH: sdk-codegen-codeGenerator.jar
    REPO_PATH: cardinal-sdk

jobs:
    check-open-pr:
        runs-on: ubuntu-latest
        name: Check for an open PR towards main
        # On `pull_request` the PR is the event itself, so there is nothing to look up.
        if: github.event_name == 'push'
        permissions:
            pull-requests: read
        outputs:
            has-open-pr: ${{ steps.check.outputs.has-open-pr }}
        steps:
            -   name: Look for an open PR from develop to main
                id: check
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    COUNT=$(gh api "repos/${{ github.repository }}/pulls?state=open&base=main&head=${{ github.repository_owner }}:develop" --jq 'length')
                    echo "Found $COUNT open PR(s) from develop towards main"
                    if [ "$COUNT" -gt 0 ]; then
                        echo "has-open-pr=true" >> $GITHUB_OUTPUT
                    else
                        echo "has-open-pr=false" >> $GITHUB_OUTPUT
                    fi

    update-ts-sdk:
        needs: check-open-pr
        # `!cancelled()` is needed because `check-open-pr` is skipped on `pull_request` events.
        if: >-
            !cancelled() && (
              github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request' && github.head_ref == 'develop')
              || (github.event_name == 'push' && needs.check-open-pr.outputs.has-open-pr == 'true')
            )
        runs-on: ubuntu-latest
        name: Setup environment & generating typescript sdk
        env:
            SDK_CODEGEN_VERSION: 1.9.1
            ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.REPO_USERNAME }}
            ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.REPO_PASSWORD }}
            ORG_GRADLE_PROJECT_mavenRepository: ${{ secrets.MAVEN_REPOSITORY }}
            ORG_GRADLE_PROJECT_mavenReleasesRepository: ${{ secrets.MAVEN_RELEASES_REPOSITORY }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    # On `pull_request` the default ref is the PR merge commit: generate from the head branch instead.
                    ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
                    submodules: 'recursive'
                    token: ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: |
                        21
                    cache: 'gradle'

            -   name: Get builder jar
                run: |
                    curl -v -u ${{ secrets.GH_USERNAME }}:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} -L -o ${{ env.BUILDER_JAR_PATH }} https://maven.pkg.github.com/icure/sdk-codegen/com/icure/wrapper-codegen/${{ env.SDK_CODEGEN_VERSION }}/wrapper-codegen-${{ env.SDK_CODEGEN_VERSION }}-runner.jar

            -   name: Write github credentials to local.properties
                run: |
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> local.properties
                    mkdir -p ksp-json-processor
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > ksp-json-processor/local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> ksp-json-processor/local.properties

            -   name: Generate JSON representation
                run: |
                    ./gradlew :cardinal-sdk:kspKotlinJvm

            -   name: Delete auto-generated files
                run: |
                    ./gradlew :ts-wrapper:clearAutoGenerated

            -   name: Generate Typescript SDK
                run: |
                    java -jar ${{ env.BUILDER_JAR_PATH }} generate --ts --input=${{ env.JSON_OUTPUT_DIR }}

            -   name: Add newly generated files
                run: |
                    ./gradlew :ts-wrapper:updateAutoGenerated

            -   name: Check git diff | if diff -> build and create a PR
                run: |
                    git diff --exit-code || echo "::set-output name=changes_detected::true"
                id: check_diff

            -   name: Check if it builds
                if: steps.check_diff.outputs.changes_detected == 'true'
                run: |
                    ./gradlew :ts-wrapper:prepareDistributionPackage

            -   name: Generate branch name
                if: steps.check_diff.outputs.changes_detected == 'true'
                id: generate_branch_name
                run: |
                    echo "BRANCH_NAME=typescript-sdk-$(date +'%Y%m%d%H%M')-${{ github.sha }}" >> $GITHUB_ENV

            -   name: Generate base
                if: steps.check_diff.outputs.changes_detected == 'true'
                id: generate_base
                run: |
                    echo "BASE_BRANCH=develop" >> $GITHUB_ENV

            -   name: Bot Details
                if: steps.check_diff.outputs.changes_detected == 'true'
                id: bot-details
                uses: raven-actions/bot-details@v1

            -   name: Create a Pull Request
                if: steps.check_diff.outputs.changes_detected == 'true'
                uses: peter-evans/create-pull-request@v7
                with:
                    token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
                    commit-message: "chore: Update Typescript SDK on PR merge to develop"
                    title: "Updated Typescript SDK"
                    add-paths: ts-wrapper/src/jsMain/typescript,ts-wrapper/src/jsMain/kotlin
                    branch: ${{ env.BRANCH_NAME }}
                    base: ${{ env.BASE_BRANCH }}
                    author: ${{ steps.bot-details.outputs.name-email }}
                    committer: ${{ steps.bot-details.outputs.name-email }}
                    team-reviewers: 'icure/dev'
                    labels: 'automation,ts-generation'
