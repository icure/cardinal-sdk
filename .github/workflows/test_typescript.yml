name: Test Typescript SDK

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tests:
                description: 'Test modules to run, e.g. "patient sharing" (empty runs everything)'
                required: false
                default: ''
                type: string

jobs:
    typescript-tests:
        runs-on: ubuntu-latest
        name: Run the typescript SDK tests  # Do not change unless you change the branch protection rules
        env:
            # Must match the typescript version of the ts-wrapper package, `tsc` has to be in the
            # path for `prepareDistributionPackage`.
            TYPESCRIPT_VERSION: 5.9.3
            ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.REPO_USERNAME }}
            ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.REPO_PASSWORD }}
            ORG_GRADLE_PROJECT_mavenRepository: ${{ secrets.MAVEN_REPOSITORY }}
            ORG_GRADLE_PROJECT_mavenReleasesRepository: ${{ secrets.MAVEN_RELEASES_REPOSITORY }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    submodules: 'recursive'
                    token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

            -   name: Set up node 22
                uses: actions/setup-node@v4
                with:
                    node-version: '22'

            # The package only depends on the sources of the SDK and of the wrapper, and on how they
            # are built, so it is rebuilt only when one of them changes. Only the main source sets are
            # hashed: the package is built from those, so a change to a test would rebuild it for
            # nothing. Note that a cache entry is visible to a workflow run only if it was created on
            # the same branch, on its base branch, or on the default branch: the first run of a branch
            # that changes the sources always rebuilds it.
            -   name: Restore the distribution package from the cache
                id: cache-package
                uses: actions/cache@v4
                with:
                    path: ts-wrapper/build/tsDistribution
                    key: cardinal-sdk-ts-package-${{ hashFiles('cardinal-sdk/src/*Main/**', 'ts-wrapper/src/jsMain/**', 'ts-wrapper/tsconfig.json', 'gradle/libs.versions.toml') }}

            -   name: Set up JDK 21
                if: steps.cache-package.outputs.cache-hit != 'true'
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: 21
                    cache: 'gradle'

            -   name: Write github credentials to local.properties
                if: steps.cache-package.outputs.cache-hit != 'true'
                run: |
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> local.properties
                    mkdir -p ksp-json-processor
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > ksp-json-processor/local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> ksp-json-processor/local.properties

            -   name: Install the typescript compiler
                if: steps.cache-package.outputs.cache-hit != 'true'
                run: npm install -g "typescript@${TYPESCRIPT_VERSION}"

            -   name: Build the distribution package
                if: steps.cache-package.outputs.cache-hit != 'true'
                run: ./gradlew :ts-wrapper:prepareDistributionPackage

            -   name: Pack the distribution package
                if: steps.cache-package.outputs.cache-hit != 'true'
                run: |
                    mkdir -p ts-wrapper/build/tsDistribution
                    npm pack --pack-destination "$PWD/ts-wrapper/build/tsDistribution" ./ts-wrapper/build/tsPackage

            -   name: Upload the distribution package
                uses: actions/upload-artifact@v4
                with:
                    name: cardinal-sdk-ts-package
                    path: ts-wrapper/build/tsDistribution/*.tgz
                    if-no-files-found: error

            -   name: Install the SDK and the test dependencies
                working-directory: ts-wrapper/test
                run: |
                    set -euo pipefail
                    npm install
                    npm install --no-save ../build/tsDistribution/icure-cardinal-sdk-*.tgz

            -   name: Compile the tests
                working-directory: ts-wrapper/test
                run: npm run build

            # Puts the existing key of each user in the directory the SDK reads it from. The name of
            # the file is the storage entry key expected by the SDK, that is
            # `org.taktik.icure.rsa.device.<dataOwnerId>.<publicKeyFingerprint>`, and its content is
            # `{"privateKey": "<the pkcs8 private key, in base64>"}`. When the key of a user is not
            # configured the SDK generates a new one and registers it on the data owner.
            -   name: Set up the keys directories
                working-directory: ts-wrapper/test
                env:
                    USER_1_PK_FILE: ${{ secrets.CARDINAL_TEST_USER_1_PK_FILE }}
                    USER_1_KEYS_DIR: ${{ secrets.CARDINAL_TEST_USER_1_PK_DIR }}
                    USER_1_PK: ${{ secrets.CARDINAL_TEST_USER_1_PK }}
                    USER_2_PK_FILE: ${{ secrets.CARDINAL_TEST_USER_2_PK_FILE }}
                    USER_2_KEYS_DIR: ${{ secrets.CARDINAL_TEST_USER_2_PK_DIR }}
                    USER_2_PK: ${{ secrets.CARDINAL_TEST_USER_2_PK }}
                run: |
                    set -euo pipefail
                    seed_key() {
                        local directory="$1" file_name="$2" content="$3"
                        mkdir -p "$directory"
                        if [ -n "$file_name" ] && [ -n "$content" ]; then
                            printf '%s' "$content" > "$directory/$file_name"
                            echo "Stored the key of $directory in $file_name"
                        else
                            echo "No key configured for $directory, the SDK will generate a new one"
                        fi
                    }
                    seed_key "$USER_1_KEYS_DIR" "$USER_1_PK_FILE" "$USER_1_PK"
                    seed_key "$USER_2_KEYS_DIR" "$USER_2_PK_FILE" "$USER_2_PK"

            # `run.mjs` exits with a non-zero status as soon as one test fails or errors, which
            # fails this step, and so the whole workflow.
            -   name: Run the tests
                working-directory: ts-wrapper/test
                run: npm test -- ${{ github.event.inputs.tests }}
                env:
                    CARDINAL_URL: "https://nightly.icure.cloud"
                    CARDINAL_USER_1_USERNAME: ${{ secrets.CARDINAL_TEST_USER_1_USERNAME }}
                    CARDINAL_USER_1_TOKEN: ${{ secrets.CARDINAL_TEST_USER_1_TOKEN }}
                    CARDINAL_USER_2_USERNAME: ${{ secrets.CARDINAL_TEST_USER_2_USERNAME }}
                    CARDINAL_USER_2_TOKEN: ${{ secrets.CARDINAL_TEST_USER_2_TOKEN }}
                    CARDINAL_KEYS_DIR: "./test-data/keys"
