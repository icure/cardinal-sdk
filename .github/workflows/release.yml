name: Release

# Performs the release declared by a merged release PR, see RELEASING.md:
#   1. validates the release tags on the merge commit (release-plan.mjs tag),
#   2. tags the merge commit and creates the GitHub release(s),
#   3. creates support/X.Y.Z for a final full release,
#   4. pins the-forge's cardinal-sdk submodule to the merge commit and pushes one cardinal-sdk-<tag> forge tag per
#      release, which starts publishing on the self-hosted runners.
# Every step skips what already exists, so a failed run can be re-run.
#
# `workflow_dispatch` is a dry run: it validates a would-be release PR, shows the plan, and runs the forge
# orchestrator without publishing. Nothing is tagged, created or pushed.

on:
    pull_request:
        types:
            - closed
        branches:
            - main
            - 'support/**'
    workflow_dispatch:
        inputs:
            title:
                description: 'Release PR title, e.g. "Release ts-2.14.11"'
                required: true
                type: string
            base:
                description: 'Branch the release PR would target: main or support/X.Y.Z'
                required: true
                type: string
            head:
                description: 'Branch the release PR would come from'
                required: true
                type: string

permissions:
    contents: read

defaults:
    run:
        # Explicit bash makes GitHub run `bash -eo pipefail`, so a failing producer in a pipe fails the step.
        shell: bash

jobs:
    release:
        # Real releases queue one after the other: without `queue: max`, a new run cancels the pending one.
        # Dry runs get their own group so they never wait for, or displace, a real release.
        # actionlint does not know `queue` yet, see .github/actionlint.yaml.
        concurrency:
            group: ${{ github.event_name == 'workflow_dispatch' && format('release-dry-{0}', github.run_id) || 'release' }}
            cancel-in-progress: false
            queue: max
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
        runs-on: ubuntu-latest
        name: Release
        env:
            DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
            # Tag pushes need the tag ruleset bypass, which only the role of this token's owner has.
            GH_TOKEN: ${{ secrets.CARDINAL_SDK_CI_PAT }}
            FORGE_TOKEN: ${{ secrets.CARDINAL_SDK_CI_PAT }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head || github.event.pull_request.merge_commit_sha }}
                    fetch-depth: 0
                    fetch-tags: true
                    token: ${{ secrets.CARDINAL_SDK_CI_PAT }}

            -   name: Set up Node
                uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Configure Git
                run: |
                    git config --global user.name "github-actions[bot]"
                    git config --global user.email "github-actions[bot]@users.noreply.github.com"

            -   name: List accepted releases
                run: .github/scripts/list-accepted-releases.sh > "$RUNNER_TEMP/accepted.txt"

            -   name: Plan the release
                id: plan
                env:
                    TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.title || github.event.pull_request.title }}
                    BASE: ${{ inputs.base }}
                    HEAD: ${{ inputs.head }}
                run: |
                    SHA=$(git rev-parse HEAD)
                    echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                    if [ "$DRY_RUN" = true ]; then
                        node .github/scripts/release-plan.mjs pr --title "$TITLE" --base-ref "$BASE" --head-ref "$HEAD" \
                            --head-sha "$SHA" --accepted-file "$RUNNER_TEMP/accepted.txt" \
                            --summary-file "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/plan.json"
                    else
                        node .github/scripts/release-plan.mjs tag --title "$TITLE" --commit "$SHA" \
                            --accepted-file "$RUNNER_TEMP/accepted.txt" \
                            --summary-file "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/plan.json"
                    fi
                    TAGS=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').releases.map((r) => r.tag).join(' ')")
                    echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
                    echo "Releases: $TAGS"

            -   name: Tag the merge commit
                if: env.DRY_RUN != 'true'
                env:
                    SHA: ${{ steps.plan.outputs.sha }}
                    TAGS: ${{ steps.plan.outputs.tags }}
                run: |
                    # Check every tag before the first write.
                    for TAG in $TAGS; do
                        EXISTING=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
                        if [ -n "$EXISTING" ] && [ "$EXISTING" != "$SHA" ]; then
                            echo "::error::$TAG already exists on $EXISTING, not on $SHA"
                            exit 1
                        fi
                    done
                    for TAG in $TAGS; do
                        if git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null; then
                            echo "$TAG already on $SHA"
                            continue
                        fi
                        git tag -a "$TAG" -m "Release $TAG" "$SHA"
                        git push origin "refs/tags/$TAG"
                    done

            -   name: Create the GitHub releases
                if: env.DRY_RUN != 'true'
                run: |
                    node -e '
                        const { releases } = require(process.env.RUNNER_TEMP + "/plan.json");
                        for (const r of releases) {
                            console.log([r.tag, r.releaseTitle, r.prerelease, r.latest, r.notesStartTag ?? ""].join("\t"));
                        }
                    ' | while IFS=$'\t' read -r TAG TITLE PRERELEASE LATEST START; do
                        if gh release view "$TAG" > /dev/null 2>&1; then
                            echo "Release $TAG already exists"
                            continue
                        fi
                        ARGS=(--verify-tag --title "$TITLE" --generate-notes "--latest=$LATEST")
                        if [ "$PRERELEASE" = true ]; then ARGS+=(--prerelease); fi
                        if [ -n "$START" ]; then ARGS+=(--notes-start-tag "$START"); fi
                        gh release create "$TAG" "${ARGS[@]}"
                    done

            -   name: Create the support branch
                if: env.DRY_RUN != 'true'
                env:
                    SHA: ${{ steps.plan.outputs.sha }}
                run: |
                    BRANCHES=$(node -p "require(process.env.RUNNER_TEMP + '/plan.json').releases.map((r) => r.supportBranch).filter(Boolean).join(' ')")
                    for BRANCH in $BRANCHES; do
                        REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
                        if [ -n "$REMOTE_SHA" ]; then
                            # Unit releases move the branch forward, so accept any descendant of the merge commit.
                            git fetch -q origin "refs/heads/$BRANCH"
                            if ! git merge-base --is-ancestor "$SHA" "$REMOTE_SHA"; then
                                echo "::error::$BRANCH already exists on $REMOTE_SHA, which does not contain $SHA"
                                exit 1
                            fi
                            echo "$BRANCH already exists"
                            continue
                        fi
                        git push origin "$SHA:refs/heads/$BRANCH"
                    done

            -   name: Show the dry run
                if: env.DRY_RUN == 'true'
                env:
                    SHA: ${{ steps.plan.outputs.sha }}
                run: |
                    node -e '
                        const { releases } = require(process.env.RUNNER_TEMP + "/plan.json");
                        const sha = process.env.SHA;
                        const lines = [];
                        for (const r of releases) {
                            lines.push("git tag -a " + r.tag + " -m \"Release " + r.tag + "\" " + sha);
                            let gh = "gh release create " + r.tag + " --verify-tag --title \"" + r.releaseTitle + "\" --generate-notes --latest=" + r.latest;
                            if (r.prerelease) gh += " --prerelease";
                            if (r.notesStartTag) gh += " --notes-start-tag " + r.notesStartTag;
                            lines.push(gh);
                            if (r.supportBranch) lines.push("git push origin " + sha + ":refs/heads/" + r.supportBranch);
                            lines.push("the-forge: tag cardinal-sdk-" + r.tag + " on a commit pinning cardinal-sdk at " + sha);
                        }
                        console.log("Dry run, these actions would be taken:\n" + lines.join("\n"));
                        if (process.env.GITHUB_STEP_SUMMARY) {
                            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                                "\n### Dry run: actions that would be taken\n\n\u0060\u0060\u0060\n" + lines.join("\n") + "\n\u0060\u0060\u0060\n");
                        }
                    '

            -   name: Hand over to the-forge
                env:
                    SHA: ${{ steps.plan.outputs.sha }}
                    TAGS: ${{ steps.plan.outputs.tags }}
                run: |
                    if [ "$DRY_RUN" = true ]; then
                        for TAG in $TAGS; do
                            echo "Dry run: running the forge orchestrator for $TAG on $SHA"
                            gh workflow run release-cardinal-sdk.yml -R icure/the-forge -f tag="$TAG" -f sha="$SHA" -f dry_run=true
                        done
                        exit 0
                    fi
                    FORGE="$RUNNER_TEMP/the-forge"
                    git clone --quiet --branch main "https://x-access-token:${FORGE_TOKEN}@github.com/icure/the-forge.git" "$FORGE"
                    cd "$FORGE"
                    NEW=()
                    for TAG in $TAGS; do
                        if git rev-parse -q --verify "refs/tags/cardinal-sdk-$TAG" > /dev/null; then
                            PINNED=$(git rev-parse "refs/tags/cardinal-sdk-$TAG^{commit}:cardinal-sdk")
                            if [ "$PINNED" != "$SHA" ]; then
                                echo "::error::cardinal-sdk-$TAG pins cardinal-sdk at $PINNED, not at $SHA"
                                exit 1
                            fi
                            echo "cardinal-sdk-$TAG already pushed"
                        else
                            NEW+=("cardinal-sdk-$TAG")
                        fi
                    done
                    if [ ${#NEW[@]} -eq 0 ]; then
                        echo "Every forge tag already exists."
                        exit 0
                    fi
                    # Point the gitlink at the merge commit directly: no need to clone the submodule.
                    git update-index --cacheinfo "160000,$SHA,cardinal-sdk"
                    if ! git diff --cached --quiet; then
                        git commit --quiet -m "chore: Update submodule on release $TAGS"
                    fi
                    for FORGE_TAG in "${NEW[@]}"; do
                        git tag -a "$FORGE_TAG" -m "cardinal-sdk ${FORGE_TAG#cardinal-sdk-} at $SHA"
                    done
                    git push --atomic origin main "${NEW[@]/#/refs/tags/}"
