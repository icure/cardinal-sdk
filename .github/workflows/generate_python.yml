name: Generate Python SDK
on:
    push:
        branches:
            - develop
env:
    JSON_OUTPUT_DIR: ./cardinal-sdk/build/generated/ksp/jvm/jvmMain/resources
    SDK_NATIVE_HEADER_FILE: ./python-wrapper/build/bin/linuxArm64/debugShared/libcardinal_sdk_native_pylib_api.h
    BUILDER_JAR_PATH: sdk-codegen-codeGenerator.jar
    REPO_PATH: cardinal-sdk

jobs:
    check-label:
        runs-on: ubuntu-latest
        name: Check if PR has python-generation label
        outputs:
            should-skip: ${{ steps.check_label.outputs.skip }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    submodules: 'recursive'
                    token: ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}

            -   name: Check if PR had python-generation label
                id: check_label
                run: |
                    # Get the commit message
                    COMMIT_MSG=$(git log -1 --pretty=%B)
                    echo "Commit message: $COMMIT_MSG"
                    
                    # Extract PR number from commit message if it's a merge commit
                    PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oP 'Merge pull request #\K\d+' || echo "")
                    
                    if [ -n "$PR_NUMBER" ]; then
                      echo "Found PR number: $PR_NUMBER"
                      # Check if the PR has the python-generation label
                      LABELS=$(curl -s -H "Authorization: token ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" \
                        "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" | \
                        jq -r '.labels[].name')
                      
                      echo "PR Labels: $LABELS"
                      
                      if echo "$LABELS" | grep -q "python-generation"; then
                        echo "PR has python-generation label, skipping workflow"
                        echo "skip=true" >> $GITHUB_OUTPUT
                      elif echo "$LABELS" | grep -q "ts-generation"; then
                        echo "PR has ts-generation label, skipping workflow"
                        echo "skip=true" >> $GITHUB_OUTPUT
                      else
                        echo "PR does not have python-generation label, continuing"
                        echo "skip=false" >> $GITHUB_OUTPUT
                      fi
                    else
                      echo "Not a PR merge commit, continuing"
                      echo "skip=false" >> $GITHUB_OUTPUT
                    fi

    setup:
        needs: check-label
        if: needs.check-label.outputs.should-skip != 'true'
        runs-on: ubuntu-24.04-arm
        name: Setup environment & generating python sdk
        env:
            SDK_CODEGEN_VERSION: 1.9.0
            ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.REPO_USERNAME }}
            ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.REPO_PASSWORD }}
            ORG_GRADLE_PROJECT_mavenRepository: ${{ secrets.MAVEN_REPOSITORY }}
            ORG_GRADLE_PROJECT_mavenReleasesRepository: ${{ secrets.MAVEN_RELEASES_REPOSITORY }}
        steps:
            -   name: Check out code
                uses: actions/checkout@v4
                with:
                    submodules: 'recursive'
                    token: ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    distribution: 'corretto'
                    java-version: |
                        21
                    cache: 'gradle'

            -   name: Get builder jar
                run: |
                    curl -v -u ${{ secrets.GH_USERNAME }}:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }} -L -o ${{ env.BUILDER_JAR_PATH }} https://maven.pkg.github.com/icure/sdk-codegen/com/icure/wrapper-codegen/${{ env.SDK_CODEGEN_VERSION }}/wrapper-codegen-${{ env.SDK_CODEGEN_VERSION }}-runner.jar

            -   name: Write github credentials to local.properties
                run: |
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> local.properties
                    mkdir -p ksp-json-processor
                    echo "githubUsername=${{ secrets.GH_USERNAME }}" > ksp-json-processor/local.properties
                    echo "githubPassword=${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" >> ksp-json-processor/local.properties

            -   name: Generate JSON representation
                run: |
                    ./gradlew :cardinal-sdk:kspKotlinJvm

            -   name: Delete auto-generated files
                run: |
                    ./gradlew :python-wrapper:clearAutoGenerated

            -   name: Generate python and kotlin classes
                run: |
                    java -jar ${{ env.BUILDER_JAR_PATH }} generate --python --input=${{ env.JSON_OUTPUT_DIR }}

            -   name: Copy generated files - first pass
                run: |
                    ./gradlew :python-wrapper:updateAutoGenerated

            -   name: Generate .h file
                run: |
                    ./gradlew :python-wrapper:linkDebugSharedLinuxArm64

            -   name: Generate cinterop
                run: |
                    java -jar ${{ env.BUILDER_JAR_PATH }} python-interop --header-file=${{ env.SDK_NATIVE_HEADER_FILE }} --base-folder=${{ env.JSON_OUTPUT_DIR }}

            -   name: Copy generated files - second pass for c interop file
                run: |
                    ./gradlew :python-wrapper:updateAutoGenerated

            -   name: Generate branch name
                id: generate_branch_name
                run: |
                    echo "BRANCH_NAME=python-sdk-$(date +'%Y%m%d%H%M')-${{ github.sha }}" >> $GITHUB_ENV

            -   name: Generate base
                id: generate_base
                run: |
                    echo "BASE_BRANCH=develop" >> $GITHUB_ENV

            -   name: Check git diff | if diff -> create a PR
                run: |
                    git diff --exit-code || echo "::set-output name=changes_detected::true"
                id: check_diff

            -   name: Bot Details
                id: bot-details
                uses: raven-actions/bot-details@v1

            -   name: Create a Pull Request
                if: steps.check_diff.outputs.changes_detected == 'true'
                uses: peter-evans/create-pull-request@v7
                with:
                    token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
                    commit-message: "chore: Update Python SDK on PR merge to develop"
                    title: "Updated Python SDK"
                    add-paths: python-wrapper/src/python,python-wrapper/src/commonMain/kotlin
                    branch: ${{ env.BRANCH_NAME }}
                    base: ${{ env.BASE_BRANCH }}
                    author: ${{ steps.bot-details.outputs.name-email }}
                    committer: ${{ steps.bot-details.outputs.name-email }}
                    team-reviewers: 'icure/dev'
                    labels: 'automation,python-generation'
